<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Page 3 — Equity movements</title>
<style>
:root {
  --bg: #F2F2F2;
  --card: #FFFFFF;
  --ink: #252423;
  --muted: #605E5C;
  --line: #E1DFDD;
  --navy: #0B3A5B;
  --blue: #118DFF;
  --teal: #00B7C3;
  --gold: #CA8A04;
  --green: #107C10;
  --red: #A4262C;
  --open: #5B5FC7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Calibri, Arial, sans-serif;
  background: #201F1E;
  color: var(--ink);
}
.canvas {
  width: 1920px;
  height: 1080px;
  background: var(--bg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 48px;
  background: var(--navy);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 28px;
  flex-shrink: 0;
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
.tabs { display: flex; gap: 4px; }
.tab {
  padding: 6px 14px;
  border-radius: 2px;
  font-size: 12px;
  color: #D2D0CE;
}
.tab.on { background: #fff; color: var(--navy); font-weight: 600; }
.title {
  margin-left: auto;
  font-size: 13px;
  color: #C8C6C4;
}
.body {
  flex: 1;
  padding: 14px 16px 16px;
  display: grid;
  gap: 12px;
}
.slicers { display: flex; gap: 10px; align-items: stretch; }
.slicer, .card, .panel {
  background: var(--card);
  border: 1px solid var(--line);
}
.slicer { padding: 8px 12px; min-width: 170px; }
.slicer h3, .panel h3, .card h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  background: #FAF9F8;
  color: var(--ink);
}
.chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.kpi-row { display: grid; grid-template-columns: 1fr 1fr 1fr 280px; gap: 12px; }
.card { padding: 12px 16px; }
.card .lbl { font-size: 12px; color: var(--muted); }
.card .val { font-size: 32px; font-weight: 700; margin-top: 4px; }
.card .sub { font-size: 12px; margin-top: 4px; color: var(--muted); }
.neg { color: var(--red); }
.pos { color: var(--green); }
.main { display: grid; grid-template-columns: 280px 1fr; gap: 12px; min-height: 0; }
.charts { display: grid; grid-template-columns: 1.1fr 1.1fr 1fr; gap: 12px; min-height: 0; }
.panel { padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; }
.panel h3 { margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 10px; }
th:first-child, td:first-child { text-align: left; }
tr.total td { font-weight: 700; border-top: 2px solid var(--navy); }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
.country { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 12px; }
.bar-bg { flex: 1; height: 10px; background: #EDEBE9; }
.bar-fill { height: 10px; background: var(--navy); }
.dt-banner {
  background: #FFF4CE;
  border: 1px solid #FCE100;
  padding: 8px 12px;
  font-size: 12px;
  display: flex;
  gap: 24px;
}
.wf-note { font-size: 11px; color: var(--muted); margin-top: 8px; }

.body { grid-template-rows: auto 1fr; }
.wf { flex: 1; }
</style></head>
<body><div class="canvas">
  <div class="topbar">
    <div class="brand">OMERS Real Estate</div>
    <div class="tabs">
      <div class="tab">Portfolio performance</div>
      <div class="tab">IS details</div>
      <div class="tab on">Equity movements</div>
    </div>
    <div class="title">All regions · Dec 31, 2019</div>
  </div>
  <div class="body">

      <div class="slicer"><h3>Scenario</h3><div class="chips"><span class="chip">Jan 2019</span><span class="chip">Jun 2019</span><span class="chip on">Dec 2019</span></div></div>

        <!-- Other CC +0.169 15.369->15.538 y15.538=80 y15.369=87 -->

        <text x="1454" y="748" text-anchor="middle" font-size="11">Other contrib.</text>
        <!-- Closing 15.538 y=80 height=640 -->
        <line x1="1498" y1="77" x2="1530" y2="77" stroke="#8A8886"/>

        <text x="90" y="800" font-size="13" fill="#605E5C">Material moves: Capex/Leasing +$1.69B, Acquisitions +$1.35B, Dispositions −$1.01B. MTM and tax are immaterial at total-portfolio scale.</text>
      </svg>
    </div>
  </div>
</div></body></html>
